[package]
name = "pynokhwa"
version = "0.1.2"
edition = "2021"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pynokhwa"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "macros", "abi3-py39", "generate-import-lib"] }
nokhwa = { git="https://github.com/maxxgx/nokhwa.git", tag="v0.10.12", features = ["input-v4l", "input-msmf", "output-threaded", "input-avfoundation", "input-native"] }
#nokhwa = { path = "vendor/nokhwa", features = ["input-v4l", "input-msmf", "output-threaded", "input-avfoundation", "input-native"] }
image = { version="0.25.6", default-features = false }
parking_lot = "^0.11"
once_cell = "1.21.3"

[dev-dependencies]
minifb = "0.25"